<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coinly — Convertisseur</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand" aria-label="Coinly">
          <span class="brand-crop">
            <img src="assets/coinly-logo.png" alt="Coinly" draggable="false">
          </span>
        </div>
        <button id="btn-open-site" class="icon-button" type="button" aria-label="Ouvrir le site Coinly" title="Ouvrir Coinly">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>
        </button>
      </header>

      <section class="intro" aria-labelledby="converter-title">
        <div>
          <p class="eyebrow">Conversion rapide</p>
          <h1 id="converter-title">Convertisseur universel</h1>
        </div>
        <span id="live-badge" class="live-badge"><span class="live-dot"></span> En direct</span>
      </section>

      <nav class="tabs" aria-label="Navigation de l’extension">
        <button class="tab active" type="button" data-panel="converter-panel" aria-selected="true">Convertir</button>
        <button class="tab" type="button" data-panel="history-panel" aria-selected="false">Historique <span id="history-count" class="tab-count">0</span></button>
      </nav>

      <section id="converter-panel" class="panel active">
        <div class="converter-card">
          <label class="field-label" for="amount-input">Montant</label>
          <div class="amount-wrap">
            <input id="amount-input" class="amount-input" type="number" min="0" step="any" inputmode="decimal" value="100" aria-describedby="conversion-status">
            <span id="amount-code" class="amount-code">EUR</span>
          </div>

          <div class="currency-grid">
            <div class="currency-field">
              <label class="field-label" for="from-currency">Depuis</label>
              <select id="from-currency" class="currency-select" aria-label="Devise de départ"></select>
            </div>

            <button id="btn-swap" class="swap-button" type="button" aria-label="Inverser les devises" title="Inverser">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path>
              </svg>
            </button>

            <div class="currency-field">
              <label class="field-label" for="to-currency">Vers</label>
              <select id="to-currency" class="currency-select" aria-label="Devise d’arrivée"></select>
            </div>
          </div>

          <div id="result-card" class="result-card" aria-live="polite">
            <div class="result-copy">
              <span id="result-source" class="result-source">100 EUR</span>
              <strong id="result-display" class="result-value">—</strong>
            </div>
            <button id="btn-copy" class="result-action" type="button" aria-label="Copier le résultat" title="Copier le résultat">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
          </div>

          <div id="conversion-status" class="status-row">
            <span id="rate-label">Taux de référence</span>
            <span id="update-time">Connexion…</span>
          </div>

          <button id="btn-favorite" class="primary-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"></path>
            </svg>
            <span>Ajouter aux favoris</span>
          </button>
        </div>

        <section id="favorites-section" class="favorites-section" hidden>
          <div class="section-heading">
            <span>Favoris</span>
            <span class="section-hint">Accès rapide</span>
          </div>
          <div id="favorites-list" class="favorites-list"></div>
        </section>
      </section>

      <section id="history-panel" class="panel" hidden>
        <div class="section-heading history-heading">
          <div>
            <p class="eyebrow">Activité récente</p>
            <h2>Historique</h2>
          </div>
          <button id="btn-clear-history" class="text-button danger" type="button">Tout effacer</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="empty-state">
            <span class="empty-icon">↔</span>
            <strong>Aucune conversion</strong>
            <span>Vos conversions récentes apparaîtront ici.</span>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>Taux de référence Frankfurter</span>
        <span id="status-message" role="status"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
